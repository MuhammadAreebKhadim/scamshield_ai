<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBladeLeft" x1="12" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="favBladeRight" x1="52" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="coreGlowFav" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-contrast rounded tile for dark/light browser tabs -->
  <rect width="64" height="64" rx="14" fill="#040814" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#1E293B" stroke-width="1.5" />

  <!-- Dual-Blade Precision Cyber Shield -->
  <!-- Left Plate -->
  <path d="M30.5 9 L13 17.5 V33 C13 44.8 20.8 52 30.5 55.5 V35 L22 28.5 L30.5 22 V9 Z" fill="url(#favBladeLeft)" />

  <!-- Right Plate -->
  <path d="M33.5 9 L51 17.5 V33 C51 44.8 43.2 52 33.5 55.5 V35 L42 28.5 L33.5 22 V9 Z" fill="url(#favBladeRight)" />

  <!-- Central Security Core -->
  <polygon points="32,22.5 37,28.5 32,34.5 27,28.5" fill="#00F2FE" filter="url(#coreGlowFav)" />
  <polygon points="32,41 35,45 32,49 29,45" fill="#38BDF8" />
</svg>
